# Units: m, rad, s. Tune Kalman noises on a recorded rosbag (stage 2).
workpiece_position_detector:
  ros__parameters:
    base_frame: base_link
    qr_side_m: 0.05
    # fallback intrinsics until a calibrated camera_info is published
    dpmm: 210.0                # px per 100 mm at nominal_distance_mm
    nominal_distance_mm: 440.0

trajectory_generator:
  ros__parameters:
    mode: direct               # direct | circle; switch live: ros2 param set /trajectory_generator mode circle
    standoff_m: 0.44
    radius_m: 0.05
    period_s: 10.0
    lost_timeout_s: 0.5
    rate_hz: 30.0
    camera_frame: camera_optical_frame
    tool_frame: tool0
    kalman_accel_noise: 0.25   # [m^2/s^4] board acceleration variance
    kalman_rot_noise: 0.001    # quaternion random walk per second
    kalman_pos_meas_noise: 1.0e-6  # [m^2] (1 mm std)
    kalman_rot_meas_noise: 1.0e-4

robot_controller:
  ros__parameters:
    base_frame: base_link
    tool_frame: tool0
    output_topic: /servo_node/pose_target_cmds
    rate_hz: 50.0
    max_linear_speed: 0.1      # [m/s]
    max_angular_speed: 0.5     # [rad/s]
    command_timeout_s: 0.5
    # shortcut: placeholder box, measure the real safe zone in the cell before stage 4
    workspace_min: [0.3, -0.6, 0.1]
    workspace_max: [1.2, 0.6, 1.2]
